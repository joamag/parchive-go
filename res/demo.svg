<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-label="Terminal session: parchive create, verify and repair">
  <defs>
    <linearGradient id="tbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262C"/><stop offset="1" stop-color="#1A1A1F"/>
    </linearGradient>
  </defs>
  <rect width="940" height="512" rx="12" fill="#0B0B0E"/>
  <path d="M0 12 A12 12 0 0 1 12 0 H928 A12 12 0 0 1 940 12 V40 H0 Z" fill="url(#tbar)"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6" fill="#28c840"/>
  <text x="470" y="25" fill="#7d94a8" font-size="12.5" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">parchive</text>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5">
    <text x="24" y="72"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive create -s4096 -c20 archive.par2 photo.raw notes.tar</tspan></text>
    <text x="24" y="94"  fill="#8fa8bd">Block size: 4096</text>
    <text x="24" y="114" fill="#8fa8bd">Source block count: 15</text>
    <text x="24" y="134" fill="#8fa8bd">Recovery block count: 20</text>
    <text x="24" y="154" fill="#8fa8bd">Recovery file count: 5</text>

    <text x="24" y="192" fill="#55707f" xml:space="preserve">  # a byte gets inserted into photo.raw; notes.tar is lost entirely</text>

    <text x="24" y="230"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive verify archive.par2</tspan></text>
    <text x="24" y="252" xml:space="preserve"><tspan fill="#F5A623">Target: "notes.tar" - missing.</tspan></text>
    <text x="24" y="274" xml:space="preserve"><tspan fill="#E5484D">Target: "photo.raw" - damaged.</tspan><tspan fill="#6d879b"> Found 10 of 10 data blocks.</tspan></text>
    <text x="24" y="296" fill="#8fa8bd">You have 10 out of 15 data blocks available.</text>
    <text x="24" y="318" fill="#8fa8bd">Repair is possible.</text>

    <text x="24" y="356" fill="#55707f" xml:space="preserve">  # photo.raw only moved, so its blocks cost no recovery data</text>

    <text x="24" y="394"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive repair archive.par2</tspan></text>
    <text x="24" y="416" fill="#8fa8bd">Verifying repaired files:</text>
    <text x="24" y="438" xml:space="preserve"><tspan fill="#30A46C">Target: "notes.tar" - found.</tspan></text>
    <text x="24" y="460" xml:space="preserve"><tspan fill="#30A46C">Target: "photo.raw" - found.</tspan></text>
    <text x="24" y="482" fill="#30A46C">Repair complete.</text>
  </g>
</svg>
