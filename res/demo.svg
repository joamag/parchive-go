<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-label="Terminal session: parchive create, verify and repair">
  <defs>
    <linearGradient id="tbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303c"/><stop offset="1" stop-color="#1a2732"/>
    </linearGradient>
  </defs>
  <rect width="940" height="490" rx="12" fill="#0d1620"/>
  <path d="M0 12 A12 12 0 0 1 12 0 H928 A12 12 0 0 1 940 12 V40 H0 Z" fill="url(#tbar)"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6" fill="#28c840"/>
  <text x="470" y="25" fill="#7d94a8" font-size="12.5" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">parchive</text>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13.5">
    <text x="24" y="72"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive create -s 4096 -n 20 archive.par2 photo.raw notes.tar</tspan></text>
    <text x="24" y="94" fill="#8fa8bd">wrote archive.par2 and archive.vol000+20.par2 (15 input slices, 20 recovery slices)</text>

    <text x="24" y="134" fill="#55707f" xml:space="preserve">  # a stray byte gets inserted into photo.raw; notes.tar is lost entirely</text>

    <text x="24" y="174"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive verify archive.par2</tspan></text>
    <text x="24" y="196" xml:space="preserve"><tspan fill="#5DD8F0">  moved    photo.raw</tspan><tspan fill="#6d879b"> (10/10 slices misplaced)</tspan></text>
    <text x="24" y="218" xml:space="preserve"><tspan fill="#F5A623">  missing  notes.tar</tspan><tspan fill="#6d879b"> (5 slices)</tspan></text>
    <text x="24" y="240" fill="#8fa8bd">5 slices need repair, 20 recovery slices available</text>

    <text x="24" y="280" fill="#55707f" xml:space="preserve">  # photo.raw only moved, so none of its slices cost recovery data</text>

    <text x="24" y="320"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive repair archive.par2</tspan></text>
    <text x="24" y="342" fill="#8fa8bd">5 slices need repair, 20 recovery slices available</text>
    <text x="24" y="364" fill="#30A46C">repaired</text>

    <text x="24" y="404"><tspan fill="#00ADD8">$</tspan><tspan fill="#dbe7f0" xml:space="preserve"> parchive verify archive.par2</tspan></text>
    <text x="24" y="426" xml:space="preserve"><tspan fill="#30A46C">  ok       photo.raw</tspan></text>
    <text x="24" y="448" xml:space="preserve"><tspan fill="#30A46C">  ok       notes.tar</tspan></text>
    <text x="24" y="470" fill="#30A46C">all files verified</text>
  </g>
</svg>
