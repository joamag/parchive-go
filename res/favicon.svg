<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Parchive-Go">
  <!-- A simplified logo for tiny sizes: the tick and the dashed edge of the
       full mark disappear below about 32px, so the restored block is told by
       colour alone and the missing one by a solid, heavier outline. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="1" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE9FA"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE7A9"/>
      <stop offset="1" stop-color="#30A46C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <g fill="url(#cy)">
    <rect x="108" y="108" width="88" height="88" rx="22"/>
    <rect x="212" y="108" width="88" height="88" rx="22"/>
    <rect x="316" y="108" width="88" height="88" rx="22"/>
    <rect x="108" y="212" width="88" height="88" rx="22"/>
    <rect x="316" y="212" width="88" height="88" rx="22"/>
    <rect x="108" y="316" width="88" height="88" rx="22"/>
    <rect x="212" y="316" width="88" height="88" rx="22"/>
  </g>
  <rect x="212" y="212" width="88" height="88" rx="22" fill="url(#gr)"/>
  <rect x="322" y="322" width="76" height="76" rx="18" fill="none" stroke="#5A5A64" stroke-width="14"/>
</svg>
