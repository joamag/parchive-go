<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 660" width="1400" height="660" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" role="img" aria-label="parchive-go pipeline: create, verify and repair a PAR2 recovery set">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a26"/><stop offset="1" stop-color="#0a131c"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6a86"/>
    </marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00ADD8"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30A46C"/>
    </marker>
  </defs>

  <rect width="1400" height="660" fill="url(#bg)"/>

  <!-- ══════════════ band separators ══════════════ -->
  <line x1="60" y1="228" x2="1340" y2="228" stroke="#1d3245" stroke-width="1"/>
  <line x1="60" y1="432" x2="1340" y2="432" stroke="#1d3245" stroke-width="1"/>

  <!-- ══════════════ 1 · CREATE ══════════════ -->
  <text x="60" y="56" fill="#00ADD8" font-size="15" font-weight="700" letter-spacing="2.4">CREATE</text>
  <text x="146" y="56" fill="#5c7a94" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">parchive create -s4096 -c20 archive.par2 file1 file2</text>

  <!-- input files -->
  <g>
    <rect x="60" y="84" width="126" height="34" rx="6" fill="#14283a" stroke="#2c4a66"/>
    <text x="123" y="106" fill="#c3d6e5" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">file1</text>
    <rect x="60" y="126" width="126" height="34" rx="6" fill="#14283a" stroke="#2c4a66"/>
    <text x="123" y="148" fill="#c3d6e5" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">file2</text>
    <text x="123" y="182" fill="#5c7a94" font-size="12" text-anchor="middle">input files</text>
  </g>
  <line x1="194" y1="122" x2="240" y2="122" stroke="#4a6a86" stroke-width="2" marker-end="url(#ar)"/>

  <!-- slices -->
  <g>
    <g fill="#0f2334" stroke="#2c4a66">
      <rect x="250" y="90" width="34" height="26" rx="4"/><rect x="290" y="90" width="34" height="26" rx="4"/>
      <rect x="330" y="90" width="34" height="26" rx="4"/><rect x="370" y="90" width="34" height="26" rx="4"/>
      <rect x="250" y="126" width="34" height="26" rx="4"/><rect x="290" y="126" width="34" height="26" rx="4"/>
      <rect x="330" y="126" width="34" height="26" rx="4"/><rect x="370" y="126" width="34" height="26" rx="4"/>
    </g>
    <text x="327" y="182" fill="#5c7a94" font-size="12" text-anchor="middle">equal-sized slices</text>
  </g>
  <line x1="414" y1="122" x2="462" y2="122" stroke="#4a6a86" stroke-width="2" marker-end="url(#ar)"/>

  <!-- encoder -->
  <g>
    <rect x="472" y="82" width="212" height="80" rx="10" fill="#102434" stroke="#00ADD8" stroke-width="1.6"/>
    <text x="578" y="112" fill="#5DD8F0" font-size="14" font-weight="700" text-anchor="middle">Reed-Solomon</text>
    <text x="578" y="134" fill="#7fa5c0" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">GF(2^16) · poly 0x1100B</text>
    <text x="578" y="182" fill="#5c7a94" font-size="12" text-anchor="middle">encode</text>
  </g>
  <line x1="694" y1="122" x2="742" y2="122" stroke="#00ADD8" stroke-width="2" marker-end="url(#arc)"/>

  <!-- recovery slices -->
  <g>
    <g fill="#0d2b38" stroke="#00ADD8" stroke-opacity=".75">
      <rect x="752" y="90" width="34" height="26" rx="4"/><rect x="792" y="90" width="34" height="26" rx="4"/>
      <rect x="832" y="90" width="34" height="26" rx="4"/>
      <rect x="752" y="126" width="34" height="26" rx="4"/><rect x="792" y="126" width="34" height="26" rx="4"/>
      <rect x="832" y="126" width="34" height="26" rx="4"/>
    </g>
    <text x="809" y="182" fill="#5c7a94" font-size="12" text-anchor="middle">recovery slices</text>
  </g>
  <line x1="876" y1="122" x2="924" y2="122" stroke="#00ADD8" stroke-width="2" marker-end="url(#arc)"/>

  <!-- output volumes -->
  <g>
    <rect x="934" y="76" width="290" height="42" rx="6" fill="#14283a" stroke="#2c4a66"/>
    <text x="950" y="103" fill="#c3d6e5" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">archive.par2</text>
    <text x="1210" y="102" fill="#5c7a94" font-size="11.5" text-anchor="end">critical packets</text>

    <rect x="934" y="126" width="290" height="42" rx="6" fill="#0d2b38" stroke="#00ADD8" stroke-opacity=".6"/>
    <text x="950" y="153" fill="#9fdcee" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">archive.vol000+20.par2</text>
    <text x="1210" y="152" fill="#5c7a94" font-size="11.5" text-anchor="end">recovery data</text>
    <text x="1079" y="192" fill="#5c7a94" font-size="12" text-anchor="middle">standard PAR2 volumes, readable by par2cmdline</text>
  </g>

  <!-- ══════════════ 2 · VERIFY ══════════════ -->
  <text x="60" y="278" fill="#00ADD8" font-size="15" font-weight="700" letter-spacing="2.4">VERIFY</text>
  <text x="146" y="278" fill="#5c7a94" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">parchive verify archive.par2</text>

  <!-- files on disk, with damage -->
  <g>
    <text x="60" y="316" fill="#5c7a94" font-size="12">files on disk</text>
    <g stroke="#2c4a66" fill="#0f2334">
      <rect x="60" y="326" width="34" height="26" rx="4"/><rect x="100" y="326" width="34" height="26" rx="4"/>
      <rect x="180" y="326" width="34" height="26" rx="4"/>
      <rect x="220" y="326" width="34" height="26" rx="4"/><rect x="260" y="326" width="34" height="26" rx="4"/>
    </g>
    <rect x="140" y="326" width="34" height="26" rx="4" fill="#3a1c1e" stroke="#E5484D"/>
    <rect x="300" y="326" width="34" height="26" rx="4" fill="#0a131c" stroke="#F5A623" stroke-dasharray="4 3"/>
    <text x="157" y="345" fill="#E5484D" font-size="15" text-anchor="middle" font-weight="700">✕</text>
    <text x="197" y="384" fill="#5c7a94" font-size="11.5" text-anchor="middle">bit rot</text>
    <text x="317" y="384" fill="#5c7a94" font-size="11.5" text-anchor="middle">missing</text>
  </g>
  <line x1="352" y1="339" x2="400" y2="339" stroke="#4a6a86" stroke-width="2" marker-end="url(#ar)"/>

  <g>
    <rect x="410" y="304" width="220" height="70" rx="10" fill="#102434" stroke="#2c4a66"/>
    <text x="520" y="330" fill="#c3d6e5" font-size="13.5" font-weight="700" text-anchor="middle">per-slice checksums</text>
    <text x="520" y="352" fill="#7fa5c0" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">CRC32 then MD5</text>
  </g>
  <line x1="640" y1="339" x2="688" y2="339" stroke="#4a6a86" stroke-width="2" marker-end="url(#ar)"/>

  <g font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="698" y="296" width="300" height="86" rx="8" fill="#0d1824" stroke="#1d3245"/>
    <text x="716" y="320" fill="#30A46C">ok       gamma.txt</text>
    <text x="716" y="342" fill="#E5484D">damaged  alpha.bin (3/13 slices bad)</text>
    <text x="716" y="364" fill="#F5A623">missing  beta.bin (4 slices)</text>
  </g>

  <!-- ══════════════ 3 · REPAIR ══════════════ -->
  <text x="60" y="482" fill="#00ADD8" font-size="15" font-weight="700" letter-spacing="2.4">REPAIR</text>
  <text x="146" y="482" fill="#5c7a94" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">parchive repair archive.par2</text>

  <g>
    <text x="60" y="520" fill="#5c7a94" font-size="12">surviving slices</text>
    <g stroke="#2c4a66" fill="#0f2334">
      <rect x="60" y="530" width="34" height="26" rx="4"/><rect x="100" y="530" width="34" height="26" rx="4"/>
      <rect x="140" y="530" width="34" height="26" rx="4"/>
    </g>
    <text x="200" y="520" fill="#5c7a94" font-size="12">+ recovery</text>
    <g fill="#0d2b38" stroke="#00ADD8" stroke-opacity=".75">
      <rect x="200" y="530" width="34" height="26" rx="4"/><rect x="240" y="530" width="34" height="26" rx="4"/>
      <rect x="280" y="530" width="34" height="26" rx="4"/>
    </g>
  </g>
  <line x1="332" y1="543" x2="380" y2="543" stroke="#4a6a86" stroke-width="2" marker-end="url(#ar)"/>

  <g>
    <rect x="390" y="508" width="248" height="70" rx="10" fill="#102434" stroke="#00ADD8" stroke-width="1.6"/>
    <text x="514" y="534" fill="#5DD8F0" font-size="13.5" font-weight="700" text-anchor="middle">Gauss-Jordan elimination</text>
    <text x="514" y="556" fill="#7fa5c0" font-size="12.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">solve over GF(2^16)</text>
  </g>
  <line x1="648" y1="543" x2="696" y2="543" stroke="#30A46C" stroke-width="2" marker-end="url(#arg)"/>

  <g>
    <text x="706" y="520" fill="#5c7a94" font-size="12">rebuilt slices</text>
    <g fill="#0f2b20" stroke="#30A46C">
      <rect x="706" y="530" width="34" height="26" rx="4"/><rect x="746" y="530" width="34" height="26" rx="4"/>
      <rect x="786" y="530" width="34" height="26" rx="4"/><rect x="826" y="530" width="34" height="26" rx="4"/>
    </g>
  </g>
  <line x1="878" y1="543" x2="926" y2="543" stroke="#30A46C" stroke-width="2" marker-end="url(#arg)"/>

  <g>
    <rect x="936" y="518" width="288" height="50" rx="8" fill="#0f2b20" stroke="#30A46C" stroke-opacity=".7"/>
    <text x="1080" y="548" fill="#7ee2b8" font-size="13.5" text-anchor="middle" font-weight="700">files restored byte-for-byte</text>
  </g>

  <text x="1340" y="632" fill="#3d5a73" font-size="12" text-anchor="end">parchive-go · PAR1 and PAR2 recovery sets in pure Go</text>
</svg>
