<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="parchive-go logo">
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12202e"/>
      <stop offset="1" stop-color="#0a131c"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DD8F0"/>
      <stop offset="1" stop-color="#00ADD8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#disc)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#00ADD8" stroke-opacity=".22" stroke-width="3"/>

  <!-- eight data slices around a ring, one of them missing and re-derived -->
  <g transform="translate(256 256)">
    <circle r="150" fill="none" stroke="#00ADD8" stroke-opacity=".14" stroke-width="2" stroke-dasharray="5 9"/>

    <!-- surviving data slices -->
    <g fill="url(#cy)">
      <g transform="rotate(-90)   translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8" transform="rotate(90)"/></g>
      <g transform="rotate(-45)   translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8" transform="rotate(45)"/></g>
      <g transform="rotate(0)     translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8"/></g>
      <g transform="rotate(45)    translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8" transform="rotate(-45)"/></g>
      <g transform="rotate(90)    translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8" transform="rotate(-90)"/></g>
      <g transform="rotate(180)   translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8" transform="rotate(180)"/></g>
      <g transform="rotate(225)   translate(0 -150)"><rect x="-26" y="-19" width="52" height="38" rx="8" transform="rotate(135)"/></g>
    </g>

    <!-- the lost slice: an empty socket being refilled -->
    <g transform="rotate(135) translate(0 -150)">
      <g transform="rotate(-135)">
        <rect x="-26" y="-19" width="52" height="38" rx="8" fill="#0a131c" stroke="#F5A623" stroke-width="3" stroke-dasharray="6 5"/>
      </g>
    </g>

    <!-- parity core: the XOR/GF(2^16) sum that rebuilds it -->
    <circle r="66" fill="#0a131c" stroke="#00ADD8" stroke-width="4"/>
    <circle r="66" fill="none" stroke="#5DD8F0" stroke-opacity=".35" stroke-width="10"/>
    <path d="M-30 0 H30 M0 -30 V30" stroke="#00ADD8" stroke-width="9" stroke-linecap="round"/>
    <circle r="30" fill="none" stroke="#00ADD8" stroke-width="9"/>

    <!-- reconstruction arrow: the parity core refills the lost slice -->
    <path d="M52 52 L86 86" stroke="#F5A623" stroke-width="8" stroke-linecap="round"/>
    <path d="M104 104 l-30 -4 l4 30 z" fill="#F5A623"/>
  </g>
</svg>
